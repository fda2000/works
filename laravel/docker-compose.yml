services:

    # HTTP-сервер
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile

#        container_name: app

        depends_on:
            migrate:
                condition: service_completed_successfully

        environment: &app-env
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE:
            DB_USERNAME:
            DB_PASSWORD:

            QUEUE_CONNECTION: rabbitmq
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_USER:
            RABBITMQ_PASSWORD:
            RABBITMQ_VHOST: /

            REDIS_HOST: redis
            REDIS_PORT: 6379

        ports:
            - "8000:8000"

        volumes:
            - .:/var/www

    # Одноразовая задача: накатывает миграции перед стартом приложения и воркеров
    migrate:
        build:
            context: .
            dockerfile: docker/php/Dockerfile

        command: php artisan migrate --force

        depends_on:
            postgres:
                condition: service_healthy

        environment: *app-env

        volumes:
            - .:/var/www

    # Обработчик критичных сообщений (высший приоритет)
    worker-critical:
        build:
            context: .
            dockerfile: docker/php/Dockerfile

        command: php artisan queue:work --queue=critical --sleep=1 --tries=3

        depends_on:
            migrate:
                condition: service_completed_successfully

        environment: *app-env

        volumes:
            - .:/var/www

    # Обработчик обычных и маркетинговых сообщений (низший приоритет)
    worker-default:
        build:
            context: .
            dockerfile: docker/php/Dockerfile

        command: php artisan queue:work --queue=default,marketing --sleep=1 --tries=3

        depends_on:
            migrate:
                condition: service_completed_successfully

        environment: *app-env

        volumes:
            - .:/var/www

    postgres:
        image: postgres:16

#        container_name: postgres

        environment:
            POSTGRES_DB:
            POSTGRES_USER:
            POSTGRES_PASSWORD:

        ports:
            - "5432:5432"

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app -d app"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    redis:
        image: redis:7-alpine

#        container_name: redis

        ports:
            - "6379:6379"

    rabbitmq:
        image: rabbitmq:3-management

#        container_name: rabbitmq

        ports:
            - "5672:5672"
            - "15672:15672"
